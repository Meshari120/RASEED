
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الصلاحيات | رصيد</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1e293b;
        }

        header {
            background: white;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
        }

        .brand {
            color: #2563eb;
            font-size: 23px;
            font-weight: bold;
        }

        .container {
            max-width: 1400px;
            margin: 35px auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 10px;
        }

        .description {
            color: #64748b;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .table-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
        }

        .table-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            border-bottom: 1px solid #e5e7eb;
        }

        .search {
            padding: 11px 14px;
            border: 1px solid #dbe1ea;
            border-radius: 8px;
            width: 280px;
            max-width: 100%;
            outline: none;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 1100px;
            border-collapse: collapse;
        }

        thead {
            background: #f8fafc;
        }

        th, td {
            padding: 15px 12px;
            text-align: right;
            border-bottom: 1px solid #edf0f4;
            vertical-align: middle;
        }

        th {
            color: #64748b;
            font-size: 13px;
            white-space: nowrap;
        }

        td {
            font-size: 13px;
        }

        tbody tr:hover {
            background: #fafcff;
        }

        .employee-id {
            color: #64748b;
            font-weight: bold;
        }

        .employee-name {
            font-weight: bold;
            min-width: 130px;
        }

        .permission-group {
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .permission-group label {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .permission-group input {
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        .group-title {
            display: block;
            color: #64748b;
            font-size: 11px;
            margin-bottom: 6px;
        }

        .permission-cell {
            min-width: 145px;
        }

        select {
            padding: 9px;
            border: 1px solid #dbe1ea;
            border-radius: 7px;
            background: white;
            min-width: 105px;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: #e2e8f0;
            color: #334155;
        }

        .message {
            display: none;
            padding: 13px 20px;
            line-height: 1.7;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            padding: 35px;
            text-align: center;
            color: #64748b;
        }

        .owner-controls {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        @media (max-width: 600px) {
            .container {
                margin-top: 22px;
            }

            .table-header {
                align-items: stretch;
                flex-direction: column;
            }

            .search {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="brand">رصيد</div>

    <button type="button" class="secondary" id="backButton">
        العودة للإعدادات
    </button>
</header>

<main class="container">

    <h1>إدارة الصلاحيات</h1>

    <p class="description">
        إدارة صلاحيات الموظفين والتحكم في الرتب وحالة الحسابات.
    </p>

    <section class="table-card">

        <div class="table-header">
            <h3>موظفو الشركة</h3>

            <input
                type="search"
                id="searchInput"
                class="search"
                placeholder="ابحث برقم الموظف أو الاسم">
        </div>

        <div id="message" class="message"></div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>اسم الموظف</th>
                        <th>قروبات الفريق</th>
                        <th>المعرفة</th>
                        <th>المهام والقرارات</th>
                        <th>التقارير</th>
                        <th class="owner-column">الرتبة</th>
                        <th class="owner-column">حالة الحساب</th>
                        <th>الإجراء</th>
                    </tr>
                </thead>

                <tbody id="employeesBody">
                    <tr>
                        <td colspan="9" class="empty">
                            جارٍ تحميل الموظفين...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </section>

</main>

<script src="assets/js/permissions.js"></script>

</body>
</html>
