
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102f58">
  <meta name="description" content="تسجيل الدخول إلى منصة رصيد">
  <title>رصيد | تسجيل الدخول</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <section class="login-screen">
    <div class="login-brand">
      <div class="brand-symbol">ر</div>
      <div>
        <h1>رصيد <span>Raseed</span></h1>
        <p>الذاكرة التشغيلية الذكية للمؤسسات</p>
      </div>
    </div>

    <div class="login-card">
      <div class="ai-icon">✳</div>

      <h2>مرحبًا بك في رصيد</h2>
      <p>سجّل الدخول للوصول إلى مساحة عملك.</p>

      <form id="loginForm">
        <label for="email">البريد الإلكتروني</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="أدخل بريدك الإلكتروني"
          autocomplete="username"
          required
        >

        <label for="password">كلمة المرور</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="أدخل كلمة المرور"
          autocomplete="current-password"
          required
        >

        <button type="submit" id="loginButton">
          تسجيل الدخول ←
        </button>

        <p id="loginError" class="error" role="alert"></p>
        <p id="loginSuccess" role="status"></p>
      </form>

      <a class="text-button" href="register.html">
        إنشاء حساب جديد
      </a>

      <div class="login-note">منصة داخلية آمنة لفريقك</div>
    </div>
  </section>

  <!-- ملفات تسجيل الدخول فقط -->
  <script src="assets/js/api/apiClient.js"></script>
  <script src="assets/js/auth/login.js"></script>
</body>
</html>
